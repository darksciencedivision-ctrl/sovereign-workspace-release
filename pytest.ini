; Repository-root pytest configuration — EPC-01 P1-4 / P1-5.
;
; This file is what makes a whole-product test run possible. Before it, running `pytest` at
; the repository root aborted with an INTERNALERROR from modules/sow/conftest.py, so no
; consolidated result had ever existed for this product.
;
; A single module still runs on its own configuration: pytest resolves the nearest ini file
; upward from its arguments, so `cd modules/sow && pytest` uses modules/sow/pytest.ini and
; never reads this file.

[pytest]

; Five separate trees each ship a `tests/` package. Under the default prepend import mode
; those collide by basename — the first `tests` package imported wins and every other
; module's `tests.*` submodule fails to resolve. importlib mode imports each test module
; without mutating sys.path, so the collision cannot arise.
addopts = --import-mode=importlib

; Trees that are not the product. `evidence/` and `dev/` are the development record and are
; export-ignored from the distribution (OD-35); collecting them tests frozen snapshots of
; old code. `release-artifacts/` is build output.
;
; `worktrees/` is RUNTIME output, and leaving it out was a defect that aborted the whole run.
; A local coding pane is bound by design to its own git worktree at
; `worktrees/worker-<pane>` (EPC-04, `WorktreeManager.create`), and each of those holds a full
; copy of `modules/sow` — `conftest.py` included. Collecting them registers the same conftest
; plugin twice, so pytest raises `ValueError: Plugin already registered` and INTERRUPTS
; collection: exit 2, no result at all, for the whole product. The directory is already
; declared runtime output in `.git/info/exclude`; this is the same fact told to pytest.
; Measured: 2 collection errors with it collected, 0 without.
norecursedirs =
    .git
    .venv
    node_modules
    __pycache__
    .pytest_cache
    evidence
    dev
    release-artifacts
    release-worktree
    worktrees

; Inherited from modules/sow/pytest.ini so the Phase 19 markers resolve when its tests are
; collected as part of a whole-product run rather than on their own.
markers =
    phase19_focused: the reproducible Phase 19 focused subset
    host_coupled: requires an otherwise idle host

; The Phase 19 path lists that decide WHICH items get those markers are deliberately NOT copied
; here. They live once, in modules/sow/pytest.ini, and `modules/sow/conftest.py` reads that file by
; explicit path — duplicating them into this config would put the same contract in two places for
; nothing but drift, and the keys would raise `PytestConfigWarning: Unknown config option` on any
; root run that collects no modules/sow item (conftest, and so its `addini`, is never loaded).
