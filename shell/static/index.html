<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="csrf-nonce" content="NONCE_PLACEHOLDER">
  <title>Sovereign Workspace Shell</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="shell">

    <!-- Branded identity rail + breadcrumb bar, matching the approved shell capture. -->
    <header class="header">
      <div class="identity-brand" aria-label="Sovereign Workspace Systems Control">
        <img class="brand-mark" src="/static/brand-mark.svg" alt="">
        <div class="brand-copy">
          <span class="brand-title">SOVEREIGN WORKSPACE</span>
          <span class="brand-subtitle">SYSTEMS CONTROL</span>
        </div>
      </div>
      <div class="header-bar">
      <div class="header-brand" aria-label="Workspace build identity">
        <span class="header-title">SWS</span>
        <span class="header-sep" aria-hidden="true">›</span>
        <span class="header-ver" id="shell-version">SWS-UI-001 v1.2</span>
        <span class="header-sep" aria-hidden="true">›</span>
        <span class="header-build" id="shell-build">build —</span>
        <span class="header-sep" aria-hidden="true">›</span>
        <span class="header-host" id="shell-host">host —</span>
      </div>
      <div class="header-right">
        <nav class="header-nav" aria-label="Shell documents">
        </nav>
        <time class="header-clock" id="shell-clock">--:--:--</time>
      </div>
      </div>
    </header>

    <!-- Pre-flight panel (collapsible): populated by app.js -->
    <details class="panel preflight-panel" id="preflight-details" open>
      <summary class="panel-summary">
        <span class="summary-title">Pre-flight</span>
        <span class="summary-note" id="preflight-summary">checking…</span>
      </summary>
      <ul class="preflight-grid" id="preflight-grid" aria-label="Pre-flight checks"></ul>
    </details>

    <!-- Module grid: 4 cards in fixed order, built by app.js -->
    <main class="module-grid" id="module-grid" aria-label="Workspace modules"></main>

    <!-- Log pane (collapsible): log output for selected module -->
    <details class="panel log-panel" id="log-details">
      <summary class="panel-summary">
        <span class="summary-title">Logs</span>
        <span class="summary-note" id="log-module-name">no module selected</span>
      </summary>
      <div class="log-toolbar">
        <span class="log-status" id="log-status" role="status"></span>
        <button class="btn btn-small" id="log-close" type="button">Close (Esc)</button>
      </div>
      <pre class="log-output" id="log-output" role="log" aria-live="polite">No module selected. Use a module’s Logs button.</pre>
    </details>

    <footer class="footer">
      <span>SWS-UI-001 v1.2 — Sovereign Workspace Shell</span>
      <span class="footer-note">local dashboard · no external assets</span>
    </footer>

    <!-- Live region for action feedback (screen readers) -->
    <p class="visually-hidden" id="action-status" role="status" aria-live="polite"></p>

    <noscript>
      <p class="noscript">The Sovereign Workspace Shell requires JavaScript to query and control modules.</p>
    </noscript>
  </div>
</body>
</html>
