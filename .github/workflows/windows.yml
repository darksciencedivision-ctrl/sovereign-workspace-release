# EPC-01 P1-6 - the Windows verification lane.
#
# This file deliberately contains almost no logic. Everything it checks lives in
# tools/ci/run_ci.ps1, so the lane and a developer run THE SAME script. A workflow that
# inlines its own list of steps drifts from what anyone runs locally, and the drift is
# discovered when the lane goes green on a tree that is broken.
#
# The product is Windows-only (docs/LIMITATIONS.md), and several of its guarantees are
# Windows-specific - Job Object containment, ConPTY, canonical path resolution through
# GetFinalPathNameByHandleW. A Linux runner could not exercise any of them, so there is no
# cross-platform matrix here and its absence is a decision rather than an omission.

name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      clean_room:
        description: "Run the clean-room install (V-1)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # F-064(e): actions are pinned to a full commit SHA (not a movable tag), with the tag in a
      # trailing comment. A tag can be repointed at attacker-controlled code; a SHA cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The boundary gate and the developer-identifier guard read `git archive HEAD`,
          # and package_boundary_gate --from-commit needs real history rather than a graft.
          fetch-depth: 0

      # SWS-CORRECTIVE-01 C2. The lane provisioned 3.12 ONLY, while tools/release/install.ps1
      # runs `py -3.14 -m venv` for the Debate module and aborts without it. The clean-room
      # stage could therefore never have passed on a runner. Both interpreters are required
      # for an install, and docs/SUPPORT-POLICY.md records why the split exists.
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      # `py -3.12` / `py -3.14` must both resolve. setup-python puts the interpreters on PATH
      # but does not register them with the launcher, so the lane asserts the exact invocation
      # the installer uses rather than discovering the gap inside the clean-room stage.
      - name: Assert both interpreters resolve through the py launcher
        shell: pwsh
        run: |
          $failed = $false
          foreach ($v in @('-3.12', '-3.14')) {
            & py $v --version
            if ($LASTEXITCODE -ne 0) { Write-Host "py $v is not available"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Python dependencies from the locks
        # F-064(a). The whole-product pytest stage shares one interpreter and PYTHONPATH across
        # every module, so EVERY module's dependencies must be present or that stage imports a
        # half-provisioned product. Previously only modules/sow was installed, so SOVEREIGN
        # (Flask, chromadb, ...) and Debate (fastapi, ...) were absent. From the lock files, never
        # from a resolver: the SBOM is generated from these same files, so a lane that resolved
        # freshly would test a different dependency set than the release describes.
        #   - 3.12 carries the shell, sow and SOVEREIGN closures (the pytest interpreter);
        #   - 3.14 carries Debate, which install.ps1 provisions under py -3.14.
        run: |
          py -3.12 -m pip install --upgrade pip
          py -3.12 -m pip install -r modules/sow/requirements.txt
          py -3.12 -m pip install -r modules/sow/requirements-dev.txt
          py -3.12 -m pip install -r modules/sovereign/WORKSPACE-RESOLVED-LOCK.txt
          py -3.14 -m pip install --upgrade pip
          py -3.14 -m pip install -r modules/debate/requirements.lock.txt

      - name: Provision the Node trees
        # F-064(b). ADR-005 blocks dependency lifecycle scripts (notably Electron's unverified
        # binary download). That posture is now REAL: each tree carries a tracked .npmrc with
        # ignore-scripts=true (previously none was tracked anywhere, so `npm ci` ran every
        # dependency's install script). `npm ci` still honours package-lock exactly, which is what
        # check_node_advisories then audits.
        run: |
          npm ci --prefix modules/sow/apps/desktop
          npm ci --prefix modules/sovereign/ui/ui_shell

      - name: Run the verification suite
        shell: pwsh
        run: |
          $cleanRoom = '${{ github.event_name }}' -ne 'workflow_dispatch' -or `
                       '${{ inputs.clean_room }}' -eq 'true'
          if ($cleanRoom) {
            ./tools/ci/run_ci.ps1 -IncludeCleanRoom
          } else {
            ./tools/ci/run_ci.ps1
          }

      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-run-record
          path: |
            shell/BUILD-MANIFEST.txt
            test-run.txt
          if-no-files-found: ignore
