[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    live_cli: deliberately invokes a live provider CLI and may spend provider quota
    phase19_focused: Phase 19 remediation and gate-focused Python subset
    host_coupled: result can depend on host load or installed host tooling; run without competing suites
# CR-030: source-only test contract. The full Phase 19 suite (tests/unit, tests/integration, ...)
# was intentionally removed in this source-only tree; the previous whole-suite measured-pass
# contract and the focused/host-coupled path lists below named files that no longer exist.
# `testpaths = tests` now
# resolves to the RETAINED, minimal high-value regression pack under tests/remediation/, which
# proves the punch-list corrections (CR-001..CR-039). `python -m pytest tests/ -q` runs exactly that
# pack and its result is truthful — it does not claim coverage the tree no longer contains.
#
# The phase19 marker lists are intentionally empty: the conftest degrades to marking nothing, which
# is correct now that the load-sensitive suites are gone. Re-populate them only if those suites are
# restored.
phase19_suite_timeout_seconds = 800
phase19_focused_paths =
phase19_host_coupled_paths =
