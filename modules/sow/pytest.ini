[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    live_cli: deliberately invokes a live provider CLI and may spend provider quota
    phase19_focused: Phase 19 remediation and gate-focused Python subset
    host_coupled: result can depend on host load or installed host tooling; run without competing suites
# Measured contract (U339 corrected wrapper + 2026-08-16 independent host review):
# 2382 passed / 0 failed / 1 skipped. HOST-COUPLED: timing and skip depend on
# installed host tooling and load; the skip is
# tests/unit/test_run_frontier_providers_ps1.py (SOW_PROVIDER_HOST_CHECK=1).
# 800s is 161.66s (25.3%) headroom over the 638.34s direct measurement.
# The previous 2381/1/1 comment was the pre-fix stale count.
# Original inherited 600s candidate ceiling failed at 18% and was never a
# measured whole-suite bound.
phase19_suite_timeout_seconds = 800
phase19_focused_paths =
    tests/unit/test_collaboration_policy_delegation.py
    tests/unit/test_operational_write_path.py
    tests/unit/test_sovereign_tools_protocol_e2e.py
    tests/unit/test_frontier_provider_recon.py
    tests/unit/test_run_frontier_providers_ps1.py
    tests/unit/test_emit_conductor_launch.py
    tests/unit/test_emit_conductor_selection.py
    tests/unit/test_emit_conductor_spawn.py
    tests/unit/test_conductor_pane_spawn.py
    tests/integration/test_operational_concurrent_processes.py
phase19_host_coupled_paths =
    # Fresh 2026-08-14 --durations=20 outliers above 15s; the next test was 7.17s.
    tests/integration/test_opencode_candidate_live.py
    tests/integration/test_opencode_worktree_live.py
    tests/integration/test_conductor_voice_feed.py
    tests/integration/test_voice_input.py
    tests/integration/test_assembled_roster.py
    tests/integration/test_wsl_parakeet.py
    tests/integration/test_frontier_process_tree.py
    tests/unit/test_no_live_provider_calls_in_suite.py
