<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Phase 1 Spike — Terminal Compositor (THROWAWAY RIG)</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #101418; color: #cfd8dc; font: 13px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 6px 10px; background: #1a2027; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #2c3640; }
    header b { color: #ffca28; }
    button { background: #263238; color: #cfd8dc; border: 1px solid #37474f; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
    button:hover { background: #37474f; }
    button.warn { border-color: #ff7043; color: #ff8a65; }
    #hud { margin-left: auto; font-family: monospace; color: #80cbc4; white-space: nowrap; }
    #checklist { padding: 4px 10px; background: #151a20; border-bottom: 1px solid #2c3640; color: #90a4ae; }
    #grid { flex: 1; display: grid; gap: 4px; padding: 4px; min-height: 0; }
    .pane { display: flex; flex-direction: column; border: 1px solid #2c3640; border-radius: 4px; overflow: hidden; min-height: 0; background: #000; }
    .pane.maximized { position: fixed; inset: 60px 8px 8px 8px; z-index: 10; }
    .pane.pinned .bar { background: #4a3320; }
    .bar { display: flex; gap: 6px; align-items: center; padding: 2px 6px; background: #1f262d; font-family: monospace; font-size: 11px; }
    .bar .state { color: #81c784; }
    .bar .state.EXITED, .bar .state.KILLED { color: #e57373; }
    .bar button { padding: 0 5px; font-size: 11px; }
    .term { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <header>
    <b>SPIKE RIG</b>
    <button id="btn-standard">1. Launch standard 6</button>
    <button id="btn-latency">2. Latency probe (200)</button>
    <button id="btn-resize">3. Resize storm</button>
    <button id="btn-layout">4. Layout storm ×20</button>
    <button id="btn-eight">5. Add panes 7–8</button>
    <button id="btn-report" class="warn">6. Generate report</button>
    <label>RAM budget MB <input id="ram-budget" type="number" value="2048" style="width:70px" /></label>
    <span id="hud">—</span>
  </header>
  <div id="checklist">Guided order: 1 → wait 60 s (streamer integrity) → 2 → 3 → 4 → 5 → wait 60 s → 6. Then quit and confirm no orphan conhost/OpenConsole in Task Manager. Report lands in tools/spike_compositor/results/.</div>
  <div id="grid"></div>
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
